<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemesanan & Pembayaran - Kopi Ruang Kita</title>
  <link href="./output.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .font-serif-custom { font-family: 'Playfair Display', serif; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#F8F1E7] text-gray-700 relative min-h-screen pb-24">

  <!-- NAVBAR -->
  <header class="bg-white text-[#4A3728] sticky top-0 z-50 shadow-sm border-b border-[#E9DDCD]">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
      <span class="text-2xl font-bold font-serif-custom tracking-wide text-[#4A3728]">Kopi Ruang Kita</span>
      <a href="index.html" class="text-[#765640] font-medium text-sm hover:underline flex items-center gap-1">
        ← Kembali ke Beranda
      </a>
    </nav>
  </header>

  <main class="container mx-auto px-5 md:px-6 py-12 max-w-6xl">
    <h1 class="text-3xl font-bold font-serif-custom text-[#4A3728] mb-2 text-center">Halaman Pemesanan & Pembayaran</h1>
    <p class="text-center text-[#5F5146] mb-10">Pilih jumlah menu yang ingin kamu pesan di bawah ini.</p>

    <div class="grid lg:grid-cols-3 gap-8">
      <!-- Daftar Menu dengan Tombol Tambah -->
      <div class="lg:col-span-2 space-y-8">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-[#E9DDCD]">
          <h2 class="text-xl font-bold text-[#4A3728] mb-4 border-b pb-3">Pilih Menu</h2>
          <div id="pesan-menu-container" class="space-y-6">
          </div>
        </div>
      </div>

      <!-- Ringkasan & Form Pembayaran -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-[#E9DDCD] h-fit sticky top-24">
        <h2 class="text-xl font-bold text-[#4A3728] mb-4 border-b pb-3">Ringkasan Pembayaran</h2>
        <div class="space-y-3 mb-6">
          <div class="flex justify-between text-[#5F5146]">
            <span>Total Item</span>
            <span id="summary-count">0 item</span>
          </div>
          <div class="flex justify-between font-bold text-lg text-[#4A3728] border-t pt-3">
            <span>Total Bayar</span>
            <span id="total-price" class="text-[#765640]">Rp 0</span>
          </div>
        </div>

        <form onsubmit="handleCheckout(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-[#4A3728] mb-1">Nama Pemesan</label>
            <input type="text" id="buyer-name" required placeholder="Masukkan nama..." class="w-full px-4 py-2 rounded-xl border border-[#E9DDCD] focus:outline-none focus:border-[#765640]" />
          </div>
          <div>
            <label class="block text-sm font-medium text-[#4A3728] mb-1">Nomor Meja / Catatan</label>
            <input type="text" id="buyer-note" required placeholder="Contoh: Meja 05" class="w-full px-4 py-2 rounded-xl border border-[#E9DDCD] focus:outline-none focus:border-[#765640]" />
          </div>
          <div>
            <label class="block text-sm font-medium text-[#4A3728] mb-1">Metode Pembayaran</label>
            <select id="payment-method" class="w-full px-4 py-2 rounded-xl border border-[#E9DDCD] focus:outline-none focus:border-[#765640] bg-white">
              <option value="Tunai di Kasir">Tunai (Bayar di Kasir)</option>
              <option value="QRIS">QRIS</option>
              <option value="Transfer Bank">Transfer Bank</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-[#765640] hover:bg-[#60432F] text-white font-semibold py-3 rounded-xl transition shadow-sm mt-4">
            Bayar & Kirim Pesanan
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Script JavaScript Eksternal -->
  <script src="script.js"></script>
</body>
</html>
